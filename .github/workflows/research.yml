name: Weekly Keyword Research

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      project:
        description: 'Project slug'
        required: true
        default: 'qserve'
        type: string
      providers:
        description: 'Comma-separated providers (brave or none by default)'
        required: true
        default: 'brave'
        type: string
      allow_unofficial:
        description: 'Explicitly opt in to unofficial endpoints (manual runs only)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: research-main
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run research
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          PROJECT: ${{ inputs.project || 'qserve' }}
          PROVIDERS: ${{ inputs.providers || 'brave' }}
          ALLOW_UNOFFICIAL: ${{ inputs.allow_unofficial || 'false' }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          args=(--project "$PROJECT" --providers "$PROVIDERS" --per-locale 4)
          if [[ "$EVENT" == "workflow_dispatch" && "$ALLOW_UNOFFICIAL" == "true" ]]; then
            args+=(--allow-unofficial)
          fi
          python -m masna3 run "${args[@]}"
      - name: Commit research snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/
          if ! git diff --cached --quiet; then
            git commit -m "data: update keyword research snapshots"
            git push
          else
            echo "No new research changes."
          fi
