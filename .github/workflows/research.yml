name: Scheduled Agent Intelligence

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-main
  cancel-in-progress: false

jobs:
  intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh plans for every configured project
        run: python -m masna3 plan-all
      - name: Research official source only when configured
        shell: bash
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: |
          if [[ -n "${BRAVE_API_KEY:-}" ]]; then
            while IFS= read -r project; do
              python -m masna3 run --project "$project" --providers brave --per-locale 2
            done < <(python -m masna3 projects)
          else
            echo 'Brave key absent; plans refreshed, no external API queries claimed.'
          fi
      - name: Commit updated project intelligence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- projects/
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh agent research plans'
            git push
          else
            echo 'No changes.'
          fi
