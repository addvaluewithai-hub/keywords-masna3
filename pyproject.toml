[project]
name = "keywords-masna3"
version = "0.1.0"
description = "Free-first, multi-project keyword research with traceable evidence"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
masna3 = "masna3.__main__:main"

[tool.setuptools.packages.find]
include = ["masna3*"]
